name: Build Production Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Assemble Complete App Project
        run: |
          # 1. Clean Flutter Project Create
          flutter create cinevora_app --org in.cinevorafilms --project-name cinevora_films
          
          # 2. Add Required OTT Streaming Dependencies
          cd cinevora_app
          flutter pub add http video_player chewie cached_network_image url_launcher
          
          # 3. Inject Master App Code
          cp ../lib/main.dart lib/main.dart
          
          # 4. Inject Full Internet & Network Permissions for HLS Streaming
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml

      - name: Compile Standalone Release APK
        working-directory: cinevora_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publish Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: CineVora-Official-App
          path: cinevora_app/build/app/outputs/flutter-apk/app-release.apk
